[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pystatial"
version = "0.1.2"
description = "A pure-Python re-implementation of Bioconductor Statial for spatial cell state analysis"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.9"
authors = [
    {name = "RebuildR Agent"},
]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "scipy>=1.8",
    "scikit-learn>=1.0",
    "anndata>=0.8",
    "scanpy>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist",
]

[tool.setuptools.packages.find]
include = ["statial*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
