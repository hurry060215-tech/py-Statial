# Pre-registered parity gate for `py-statial`
#
# COMMIT THIS BEFORE THE AGENT LOOP BEGINS.
# These fields are READ-ONLY after the Acceleration Agent starts.

package: py-statial
upstream:
  name: Statial
  version: "1.11.6"
  source: Bioconductor
  url: https://github.com/SydneyBioX/Statial

# Primary algorithm class: deterministic numerical
# Most functions return float vectors/matrices (distances, abundances, L-values)
# Stochastic functions (calcContamination, relabelKontextual) are seed-lockable
algorithm_class: deterministic

# Standard deterministic threshold
parity_threshold: 1.0e-8

# Canonical fixture — kerenSCE (Breast cancer MIBI-TOF, bundled with R package)
fixture:
  path: data/kerenSCE.rds
  source: Statial R package (data("kerenSCE"))
  description: "Keren et al. 2018 MIBI-TOF breast cancer, patient 6"
  expected_shape: [~5000, ~40]

# How the R reference is invoked
reference_command: tests/r_reference_driver.R

# RNG seed for stochastic functions
seed: 42

# Outputs compared — one per core function
outputs:
  - name: distances
    type: "matrix"
    location_reference: "$.distances"
    location_candidate: "adata.obsm['distances']"
    metric: max_abs_error
    threshold: 1.0e-8

  - name: abundances
    type: "matrix"
    location_reference: "$.abundances"
    location_candidate: "adata.obsm['abundances']"
    metric: max_abs_error
    threshold: 1.0e-8

  - name: kontextual_values
    type: "dataframe"
    location_reference: "$.kontextual"
    location_candidate: "result.kontextual"
    metric: max_abs_error
    threshold: 1.0e-8

  - name: contamination_scores
    type: "matrix"
    location_reference: "$.contaminations"
    location_candidate: "adata.obsm['contaminations']"
    metric: max_abs_error
    threshold: 1.0e-6

  - name: state_changes
    type: "dataframe"
    location_reference: "$.state_changes"
    location_candidate: "result.state_changes"
    metric: spearman_pval
    threshold: 0.90

# Acceleration Agent
acceleration:
  enabled: true
  max_iterations: 20
  must_pass_gate: true

audit_class: null
created_by: rebuildr-agent
created_at: 2026-05-27
